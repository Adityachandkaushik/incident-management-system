{% extends "base.html" %}

{% block title %}Declare Incident - OpsConsole{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="mb-3">
            <a href="{{ url_for('incidents.dashboard') }}" class="btn-sre-ghost py-1 px-2">
                <i class="bi bi-arrow-left me-1"></i> Cancel & Return
            </a>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>Log Production Disruption</span>
                <i class="bi bi-exclamation-triangle-fill text-warning"></i>
            </div>
            <div class="panel-body">
                <form action="{{ url_for('incidents.create_incident') }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Incident Summary *</label>
                        <input type="text" class="form-control code-block" id="title" name="title" 
                               placeholder="e.g. Rate-limit threshold failures across payments-api" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="form-label">Assessed Severity / Tier *</label>
                        <select class="form-select code-block" id="priority" name="priority" required>
                            <option value="Low">Low - Minimal workload impairment</option>
                            <option value="Medium" selected>Medium - Degraded operation with workaround</option>
                            <option value="High">High - Core service impacted, partial outage</option>
                            <option value="Critical">Critical - Comprehensive service outage</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Diagnostic Telemetry & Trace *</label>
                        <textarea class="form-control code-block" id="description" name="description" rows="5" 
                                  placeholder="Detail the timeline, symptoms, affected services, and reproduction steps..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-10">
                        <a href="{{ url_for('incidents.dashboard') }}" class="btn-sre-ghost">Cancel</a>
                        <button type="submit" class="btn-sre-primary">
                            <i class="bi bi-check2"></i>
                            <span>Publish Incident</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
