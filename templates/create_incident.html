{% extends "base.html" %}

{% block title %}Create Incident - Incident Control{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="mb-3">
            <a href="{{ url_for('incidents.dashboard') }}" class="btn-ops-subtle">
                <i class="bi bi-arrow-left me-1"></i> Cancel & Return
            </a>
        </div>

        <div class="ops-box">
            <div class="ops-header">Declare New Incident</div>
            <div class="ops-body">
                <form action="{{ url_for('incidents.create_incident') }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label mono small text-secondary">Incident Title *</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Ingress gateway latency degradation" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="form-label mono small text-secondary">Priority Level *</label>
                        <select class="form-select" id="priority" name="priority" required>
                            <option value="Low">Low (Minimal disruption)</option>
                            <option value="Medium" selected>Medium (Degraded operation with workaround)</option>
                            <option value="High">High (Major subsystem impaired)</option>
                            <option value="Critical">Critical (Total production outage)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label mono small text-secondary">Diagnostic Details & Timeline *</label>
                        <textarea class="form-control mono" id="description" name="description" rows="5" placeholder="Log snippets, impacted nodes, reproduction steps..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top border-secondary border-opacity-25 pt-3">
                        <a href="{{ url_for('incidents.dashboard') }}" class="btn-ops-subtle">Cancel</a>
                        <button type="submit" class="btn-ops">Publish Incident</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
