{% extends "base.html" %}

{% block title %}Create Incident - Incident Operations{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-7 col-xl-6">
        <div class="mb-3">
            <a href="{{ url_for('incidents.dashboard') }}" class="btn-sre-ghost py-1 px-2">
                <i class="bi bi-arrow-left me-1"></i> Cancel
            </a>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>Declare New Incident</span>
                <i class="bi bi-exclamation-triangle-fill text-warning"></i>
            </div>
            <div class="panel-body">
                <form action="{{ url_for('incidents.create_incident') }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Incident Title *</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               placeholder="e.g. Ingress latency degradation in us-east-1" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority *</label>
                        <select class="form-select code-block" id="priority" name="priority" required>
                            <option value="Low">Low - Minimal workflow impact</option>
                            <option value="Medium" selected>Medium - Degraded operation with workaround</option>
                            <option value="High">High - Subsystem impaired, core service partial outage</option>
                            <option value="Critical">Critical - Full system outage, revenue impacted</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description *</label>
                        <textarea class="form-control code-block" id="description" name="description" rows="5" 
                                  placeholder="Detail the timeline, symptoms, affected services, and reproduction steps..." required></textarea>
                    </div>

                    <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-10">
                        <a href="{{ url_for('incidents.dashboard') }}" class="btn-sre-ghost">Cancel</a>
                        <button type="submit" class="btn-sre-primary">
                            <i class="bi bi-plus-circle"></i>
                            <span>Create Incident</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
