{% extends "base.html" %}

{% block title %}Enrollment - OpsConsole{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="panel">
            <div class="panel-header justify-content-center text-center">
                <span>OPERATOR ONBOARDING</span>
            </div>
            <div class="panel-body">
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Assigned Handle</label>
                        <input type="text" class="form-control code-block" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Passphrase</label>
                        <input type="password" class="form-control code-block" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-sre-primary w-100 justify-content-center py-2">
                        <i class="bi bi-shield-plus"></i>
                        <span>Provision Credentials</span>
                    </button>
                </form>
                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-10">
                    <span class="text-secondary small">Existing credential? </span>
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none text-primary code-block">Authenticate</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
