{% extends "base.html" %}

{% block title %}Register - Incident Management{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    Create Account
                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Register
                    </button>

                </form>


                <div class="text-center mt-3">

                    <span>
                        Already have an account?
                    </span>

                    <a href="{{ url_for('auth.login') }}">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
