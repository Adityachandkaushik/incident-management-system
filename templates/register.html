<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Incident Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow border-0" style="max-width: 450px; width: 100%;">

            <div class="card-body p-4">

                <!-- Header -->
                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Create Account
                    </h2>

                    <p class="text-muted mb-0">
                        Join the Incident Management System
                    </p>

                </div>

                <!-- Register Form -->
                <form method="POST">

                    <!-- Name -->
                    <div class="mb-3">

                        <label for="name" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                    <!-- Password -->
                    <div class="mb-3">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <div class="form-text">
                            Password must be at least 6 characters.
                        </div>

                    </div>

                    <!-- Role -->
                    <div class="mb-4">

                        <label for="role" class="form-label">
                            Role
                        </label>

                        <select
                            id="role"
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="" selected disabled>
                                Select your role
                            </option>

                            <option value="user">
                                User
                            </option>

                            <option value="engineer">
                                Engineer
                            </option>

                            <option value="admin">
                                Admin
                            </option>

                        </select>

                    </div>

                    <!-- Register Button -->
                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            Create Account
                        </button>

                    </div>

                </form>

                <!-- Login Link -->
                <div class="text-center mt-4">

                    <span class="text-muted">
                        Already have an account?
                    </span>

                    <a
                        href="/login"
                        class="text-decoration-none fw-semibold"
                    >
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
