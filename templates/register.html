{% extends "base.html" %}

{% block title %}Register - Incident Operations{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="panel">
            <div class="panel-header justify-content-center">
                <span>Create Operator Account</span>
            </div>
            <div class="panel-body">
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Choose password" required>
                    </div>
                    <button type="submit" class="btn-sre-primary w-100 justify-content-center py-2">
                        <span>Register Account</span>
                    </button>
                </form>
                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-10">
                    <span class="text-secondary small">Already registered? </span>
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
