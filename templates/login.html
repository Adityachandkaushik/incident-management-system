{% extends "base.html" %}

{% block title %}Login - Incident Operations{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(80vh - 120px);">
    <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-dark text-white mb-2 shadow-sm">
                <i class="bi bi-shield-lock fs-3"></i>
            </div>
            <h1 class="h4 fw-bold text-slate-900 mb-1">Incident Management</h1>
            <p class="text-muted small mb-0">Sign in to your operational dashboard</p>
        </div>

        <div class="ops-card">
            <div class="ops-card-body p-4">
                <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input 
                                type="text" 
                                class="form-control border-start-0 ps-0" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username" 
                                required 
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-key"></i>
                            </span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-0" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                            >
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-ops-primary py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center pt-2 border-top">
                    <span class="text-muted small">Need an account? </span>
                    <a href="{{ url_for('auth.register') }}" class="small text-decoration-none fw-semibold">
                        Create Account
                    </a>
                </div>
            </div>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
            Internal Operations System &bull; Authorized Personnel Only
        </p>
    </div>
</div>
{% endblock %}
