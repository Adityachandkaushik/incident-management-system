{% extends "base.html" %}

{% block title %}Sign In - Incident Control{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="ops-box">
            <div class="ops-header text-center">Operator Authentication</div>
            <div class="ops-body">
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="mono small text-secondary mb-1">Operator ID / Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="mono small text-secondary mb-1">Access Token / Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-ops w-100 py-2">Authorize Access</button>
                </form>
                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                    <span class="small text-secondary">New operator? </span>
                    <a href="{{ url_for('auth.register') }}" class="small text-decoration-none">Create account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
